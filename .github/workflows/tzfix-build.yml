name: Build tzfix image

# 每天 03:17 UTC 检查上游最新 release；有新版本才构建（已存在则跳过）
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Immich release tag, e.g. v3.2.4 (空白 = 自动取上游最新 release)'
        required: false
        default: ''
      force:
        description: '即使镜像已存在也强制重建'
        type: boolean
        required: false
        default: false

concurrency:
  group: tzfix-build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM_REPO: immich-app/immich
  PATCH_FILE: tzfix/tz-fix.patch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Resolve version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ -n "${REQUESTED}" ]; then
            ver="${REQUESTED}"
          else
            ver="$(gh api "repos/${UPSTREAM_REPO}/releases/latest" --jq .tag_name)"
          fi
          tag="tzfix-${ver#v}"
          {
            echo "version=${ver}"
            echo "tag=${tag}"
            echo "image=ghcr.io/${owner}/immich-server:${tag}"
            echo "latest=ghcr.io/${owner}/immich-server:tzfix-latest"
          } >> "$GITHUB_OUTPUT"
          echo "resolved: version=${ver} tag=${tag}"

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if image already exists
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "${FORCE}" = "true" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${{ steps.resolve.outputs.image }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout upstream source
        if: steps.check.outputs.exists == 'false'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ steps.resolve.outputs.version }}
          path: src

      - name: Apply tz fix
        if: steps.check.outputs.exists == 'false'
        working-directory: src
        run: |
          set -euo pipefail
          git apply --verbose "${GITHUB_WORKSPACE}/${{ env.PATCH_FILE }}"
          grep -q "derive the timeZone offset" server/src/services/metadata.service.ts

      - uses: docker/setup-buildx-action@v4.4.1
        if: steps.check.outputs.exists == 'false'

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7.4.0
        with:
          context: src
          file: src/server/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            DEVICE=cpu
            BUILD_SOURCE_REF=${{ steps.resolve.outputs.version }}
          tags: |
            ${{ steps.resolve.outputs.image }}
            ${{ steps.resolve.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
